
name: Extract Chrona X Native source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHRONAX_TOKEN }}
          persist-credentials: true

      - name: Extract project archive
        run: |
          set -euo pipefail
          ARCHIVE="Chrona_X_Native_7.1.0.10.00-release.zip"
          test -f "$ARCHIVE"
          mkdir -p /tmp/chrona-native
          unzip -q "$ARCHIVE" -d /tmp/chrona-native
          ROOT="/tmp/chrona-native/Chrona_X_Native_7.1.0.10.00-release"
          test -d "$ROOT"
          cp -a "$ROOT/." .

      - name: Commit extracted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract Chrona X Native project source"
          git push
          
